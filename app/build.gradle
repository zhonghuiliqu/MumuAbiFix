plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mumu.abifix'
    compileSdk 34

    defaultConfig {
        applicationId "com.mumu.abifix"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 签名参数：优先从环境变量读取（CI 由 GitHub Secrets 注入），本地构建回退到默认值。
    // 注意：变量名不能和 DSL 方法名(storePassword/keyAlias/keyPassword)重名，否则 Groovy 报错。
    def storePwd   = System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "abifix123"
    def keyPwd     = System.getenv("RELEASE_KEY_PASSWORD") ?: "abifix123"
    def aliasName  = System.getenv("RELEASE_KEY_ALIAS") ?: "abifix"

    signingConfigs {
        release {
            storeFile rootProject.file("release.keystore")
            storePassword storePwd
            keyAlias aliasName
            keyPassword keyPwd
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
